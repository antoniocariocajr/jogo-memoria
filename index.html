<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>

    <link rel="stylesheet" href="./src/styles/main.css">
    <link rel="stylesheet" href="./src/styles/reset.css">
</head>

<body>
    <!-- Start Screen -->
    <div id="start-screen" class="screen">
        <div class="content">
            <h1>Memory Game</h1>
            <p>Encontre os pares dos heróis!</p>
            <button id="start-btn" class="btn-primary">Iniciar Jogo</button>
        </div>
    </div>

    <!-- Victory Screen -->
    <div id="victory-screen" class="screen hidden">
        <div class="content">
            <h1>Vitória!</h1>
            <p>Você venceu com <span id="final-moves">0</span> movimentos!</p>
            <button id="restart-btn" class="btn-primary">Jogar Novamente</button>
        </div>
    </div>

    <div class="container hidden" id="game-container">
        <div class="stats-bar">
            <div class="stat-item">Movimentos: <span id="moves-count">0</span></div>
            <div class="stat-item">Pares: <span id="pairs-count">0/8</span></div>
        </div>

        <h2> JOGO DA MEMÓRIA</h2>
        <div class="game">
            <!-- Cards injected by JS -->
        </div>
        <button class="reset" id="reset">
            Reiniciar
        </button>
    </div>
    <script src="./src/scripts/engine.js"></script>
</body>

</html>
